<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="brand-logo">POLESTAR</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="cars.html">Cars</a>
      <a href="services.html">Services</a>
      <a href="about.html">About Team</a>
      <a href="contact.html" class="active">Contact</a>
    </div>
  </nav>

  <main class="container" style="text-align: center;">
    <h2>Contact Us</h2>
    <p>Have questions about our vehicle models or services? Send us a message.</p>

    <!-- Step 5: Functional Form -->
    <form id="contact-form">
      <div class="form-group">
        <label for="username">Full Name</label>
        <input type="text" id="username" name="username" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="model-choice">Model of Interest</label>
        <select id="model-choice" name="model">
          <option value="rs6">Polestar RS Fastback</option>
          <option value="m4">Polestar M Coupe</option>
          <option value="911">Polestar 911 Edition</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your inquiry here..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">Submit Inquiry</button>
    </form>
  </main>

  <footer>
    <p>Team Members: Miras, Bekarys</p>
    <p>&copy; 2026 WEB1 Team Project. All rights reserved.</p>
  </footer>

</body>
</html>
