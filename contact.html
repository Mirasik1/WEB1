<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDrive - Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header id="main-header">
        <h1>AutoDrive Dealership</h1>
        <nav class="nav-menu">
            <a href="index.html">Home</a>
            <a href="cars.html">Cars</a>
            <a href="services.html">Services</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Us & Test Drive</h2>
            <form id="contact-form">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="car-color">Preferred Car Color:</label><br>
                <input type="color" id="car-color" name="car-color"><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4"></textarea><br><br>

                <button type="submit" class="submit-btn">Send Request</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Team Members: Miras, Bekarys</p>
    </footer>

</body>
</html>
